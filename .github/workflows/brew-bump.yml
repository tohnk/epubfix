name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - name: Bump Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          # Your formula name in homebrew-tap (e.g., Formula/epubfix.rb or epubfix)
          formula-name: Formula/epubfix.rb
          # The tap repo to push updates to
          homebrew-tap: tohnk/homebrew-tap
          # Optional: relative path inside homebrew-tap if not standard Formula/<name>.rb
          # formula-path: Formula/epubfix.rb
          download-url: https://github.com/tohnk/epubfix/archive/refs/tags/${{ github.event.release.tag_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
